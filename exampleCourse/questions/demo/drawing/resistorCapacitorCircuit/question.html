<pl-question-panel>

<p>
    Switch $B$ is open and switch $A$ has been closed for a long time. What is the charge on the capacitor?
</p>

<pl-figure file-name="figure.svg" type="dynamic" alt="RC circuit: battery V in series with resistor R1, capacitor branch with open switch B and capacitor C in parallel with resistor R2"></pl-figure>

<p> The input variables are provided below: </p>
<pl-variable-output digits="0" show-matlab="false" show-mathematica="false" show-r="false">
    <pl-variable params-name="V_quantity">V</pl-variable>
    <pl-variable params-name="R1_quantity">R1</pl-variable>
    <pl-variable params-name="R2_quantity">R2</pl-variable>
    <pl-variable params-name="C_quantity">C</pl-variable>
</pl-variable-output>

</pl-question-panel>

<p>
    <pl-units-input aria-label="Capacitor charge" answers-name="charge" label="$Q =$" placeholder="e.g. 120 uC"></pl-units-input>
</p>
