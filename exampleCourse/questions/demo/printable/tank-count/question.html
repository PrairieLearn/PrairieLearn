<pl-question-panel>
  <p><strong>5 points.</strong> A garden needs 2,750 liters of stored rainwater. Each tank provides 600 liters of usable storage. What is the smallest whole number of tanks that meets the requirement?</p>
</pl-question-panel>
<pl-integer-input answers-name="tanks" correct-answer="5" label="Number of tanks"></pl-integer-input>
<pl-answer-panel>
  <p>$$2750/600=4.5833\ldots$$</p>
  <p>Round up to <strong>5 tanks</strong>. Four tanks store only 2,400 liters; five store 3,000 liters.</p>
</pl-answer-panel>
