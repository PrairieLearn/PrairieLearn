<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
<title id="title">Water stored over thirty minutes</title>
<desc id="desc">Volume rises from 200 to 600 liters between 0 and 10 minutes, stays at 600 until 20 minutes, then falls to 300 liters at 30 minutes.</desc>
<rect width="600" height="320" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#222">
<path d="M70 258.0H550" stroke="#c8c8c8"/><text x="57" y="263.0" text-anchor="end">0</text>
<path d="M70 228.0H550" stroke="#c8c8c8"/><text x="57" y="233.0" text-anchor="end">100</text>
<path d="M70 198.0H550" stroke="#c8c8c8"/><text x="57" y="203.0" text-anchor="end">200</text>
<path d="M70 168.0H550" stroke="#c8c8c8"/><text x="57" y="173.0" text-anchor="end">300</text>
<path d="M70 138.0H550" stroke="#c8c8c8"/><text x="57" y="143.0" text-anchor="end">400</text>
<path d="M70 108.0H550" stroke="#c8c8c8"/><text x="57" y="113.0" text-anchor="end">500</text>
<path d="M70 78.0H550" stroke="#c8c8c8"/><text x="57" y="83.0" text-anchor="end">600</text>
<path d="M70 48.0H550" stroke="#c8c8c8"/><text x="57" y="53.0" text-anchor="end">700</text>
<path d="M70 48V258" stroke="#c8c8c8"/><text x="70" y="282" text-anchor="middle">0</text>
<path d="M150 48V258" stroke="#c8c8c8"/><text x="150" y="282" text-anchor="middle">5</text>
<path d="M230 48V258" stroke="#c8c8c8"/><text x="230" y="282" text-anchor="middle">10</text>
<path d="M310 48V258" stroke="#c8c8c8"/><text x="310" y="282" text-anchor="middle">15</text>
<path d="M390 48V258" stroke="#c8c8c8"/><text x="390" y="282" text-anchor="middle">20</text>
<path d="M470 48V258" stroke="#c8c8c8"/><text x="470" y="282" text-anchor="middle">25</text>
<path d="M550 48V258" stroke="#c8c8c8"/><text x="550" y="282" text-anchor="middle">30</text>
<path d="M70 42V258H560" fill="none" stroke="#222" stroke-width="2"/>
<text x="310" y="311" text-anchor="middle">Time (min)</text>
<text transform="translate(20 150) rotate(-90)" text-anchor="middle">Volume (L)</text>
<polyline points="70,198 230,78 390,78 550,168" fill="none" stroke="#222" stroke-width="3"/>
<circle cx="70" cy="198" r="4.5" fill="#222"/>
<circle cx="230" cy="78" r="4.5" fill="#222"/>
<circle cx="390" cy="78" r="4.5" fill="#222"/>
<circle cx="550" cy="168" r="4.5" fill="#222"/>
</g></svg>
