<pl-card header="A symbolic set with named domains">
  <pl-question-panel>
    <p>Enter the set of all nonzero real numbers.</p>
  </pl-question-panel>
  <pl-set-symbolic-input
    answers-name="nonzero-reals"
    correct-answer="R - {0}"
    formula-editor="true"
    label="$S =$"
  ></pl-set-symbolic-input>
</pl-card>

<pl-card header="A symbolic interval with a scalar endpoint">
  <pl-question-panel>
    <p>Enter the closed interval from $-a$ to $a$.</p>
  </pl-question-panel>
  <pl-set-symbolic-input
    answers-name="interval"
    variables="a"
    correct-answer="[-a, a]"
    label="$I =$"
  ></pl-set-symbolic-input>
</pl-card>
