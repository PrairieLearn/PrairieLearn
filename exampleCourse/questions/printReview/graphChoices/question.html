<pl-question-panel>
  <p>
    Which graph represents a line with a
    <strong>negative slope</strong>
    through the origin? All graphs use the same axis scale.
  </p>
</pl-question-panel>
<pl-multiple-choice answers-name="graph" number-answers="4">
  <pl-answer correct="false">
    <pl-figure file-name="rising.svg" width="360" alt="Line rising from left to right"></pl-figure>
  </pl-answer>
  <pl-answer correct="true">
    <pl-figure
      file-name="falling.svg"
      width="360"
      alt="Line falling from left to right"
    ></pl-figure>
  </pl-answer>
  <pl-answer correct="false">
    <pl-figure
      file-name="flat.svg"
      width="360"
      alt="Horizontal line through the origin"
    ></pl-figure>
  </pl-answer>
  <pl-answer correct="false">
    <pl-figure
      file-name="steep.svg"
      width="360"
      alt="Steep line rising from left to right"
    ></pl-figure>
  </pl-answer>
</pl-multiple-choice>
<pl-answer-panel>
  <p>A negative slope means that $y$ decreases as $x$ increases.</p>
</pl-answer-panel>
