# This workflow uses `pull_request_target` to run in the base repository context,
# which grants access to secrets needed for the GitHub App token. This is necessary
# because Dependabot-triggered workflows have restricted secret access.
#
# Security considerations:
# - Only runs when github.actor is dependabot[bot], preventing abuse from forks

name: 'Dedupe Dependabot PRs'

on:
  pull_request_target:
    branches:
      - master
    paths:
      - 'pnpm-lock.yaml'
      - '.github/actions/**'
      - '.github/workflows/**'

jobs:
  dedupe:
    name: 'Dedupe dependencies'
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 'Configure Git'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 'Dedupe dependencies'
        run: pnpm dedupe
      - name: 'Commit changes'
        run: |
          git add .
          git diff --cached --quiet || git commit -m 'Dedupe dependencies'

      - name: 'Push changes'
        run: |
          git push
