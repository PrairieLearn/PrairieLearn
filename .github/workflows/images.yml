name: Images

on:
  push:
    branches:
      - 'master'
      # Build on all code freeze branches since we will deploy from them.
      - '**-code-freeze'
  pull_request:
  merge_group:

concurrency:
  # Ensure that we only run one concurrent job for Pull Requests. This ensures
  # that someone can't kill our throughput by pushing a bunch of commits to a
  # single branch in rapid succession.
  #
  # However, for master builds, we allow maximum concurrency. This is achieved
  # because `github.head_ref` isn't defined there, and `github.run_id` is
  # globally unique in this repo.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-workspace-images:
    name: Workspaces
    uses: ./.github/workflows/image-builder.yml
    with:
      group: workspaces
      images: prairielearn/workspace-jupyterlab-base,prairielearn/workspace-jupyterlab-python,prairielearn/workspace-jupyterlab-r,prairielearn/workspace-rstudio,prairielearn/workspace-vscode-base,prairielearn/workspace-vscode-cpp,prairielearn/workspace-vscode-java,prairielearn/workspace-vscode-python,prairielearn/workspace-xtermjs
    secrets: inherit

  build-grader-images:
    name: Graders
    uses: ./.github/workflows/image-builder.yml
    with:
      group: graders
      images: prairielearn/grader-c,prairielearn/grader-java,prairielearn/grader-python,prairielearn/grader-r
      cache_images: prairielearn/grader-c,prairielearn/grader-python
    secrets: inherit

  build-core-images:
    name: Core
    uses: ./.github/workflows/image-builder.yml
    with:
      group: core
      images: prairielearn/prairielearn,prairielearn/executor
      cache_images: prairielearn/prairielearn
    secrets: inherit

  # Wrangler builds and pushes this image to Cloudflare when the course agent is
  # deployed. The course agent's `make build` skips the image so that it works
  # without Docker, so build it here to catch Dockerfile breakage before deploy.
  build-course-agent-image:
    name: Course agent sandbox
    runs-on: ubuntu-24.04

    env:
      # Secrets aren't accessible for PRs coming from forks, and we also can't
      # check secrets in an `if` conditional, so we check for the presence of
      # the secret here and use this value in conditionals below.
      CAN_PUSH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      # We never push this image, but we still authenticate if the secrets are
      # available so that we don't hit image pull rate limits.
      - name: Login to DockerHub
        if: ${{ env.CAN_PUSH_IMAGE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Matches `containers[].images.courseAgent` in apps/course-agent/wrangler.jsonc.
      # Cloudflare Containers run on linux/amd64.
      - name: Build the course agent sandbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/course-agent
          file: apps/course-agent/container/Dockerfile
          platforms: linux/amd64
          push: false

  report-image-sizes:
    runs-on: ubuntu-latest
    needs:
      - build-workspace-images
      - build-grader-images
      - build-core-images
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create directory for metadata
        run: mkdir -p ${{ runner.temp }}/image-metadata

      - name: Download metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: image-metadata-*-${{ env.COMMIT_SHA }}
          path: ${{ runner.temp }}/image-metadata
          merge-multiple: true

      - name: Collect image sizes
        run: python3 scripts/build_images/collect_sizes.py
        env:
          METADATA_DIR: ${{ runner.temp }}/image-metadata
          OUTPUT_PATH: ${{ runner.temp }}/image-sizes.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: pnpm --filter @prairielearn/actions-report-image-sizes... install

      - name: Build
        run: pnpm build
        working-directory: packages/actions-report-image-sizes

      - name: Report image sizes
        uses: ./packages/actions-report-image-sizes
        with:
          title: All images
          sha: ${{ env.COMMIT_SHA }}
          pushed: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sizes-path: ${{ runner.temp }}/image-sizes.json
          report-path: ${{ runner.temp }}/image-sizes-section.md

      - name: Upload CI report artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-image-sizes
          path: ${{ runner.temp }}/image-sizes-section.md
          retention-days: 1
