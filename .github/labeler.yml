documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'mkdocs.yml'
docker:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Dockerfile'
          - 'docker-compose.yml'
element:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/prairielearn/elements/**'
python:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/prairielearn/python/**'
          - 'apps/prairielearn/elements/**/*.py'
          - 'pyproject.toml'

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Makefile'
github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
autograder-python:
  - changed-files:
      - any-glob-to-any-file:
          - 'graders/python/**'
schema:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/prairielearn/src/schemas/**'
'feature: course agent':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/course-agent/**'
          - 'packages/course-agent-types/**'
          - 'apps/prairielearn/src/ee/components/courseAgent/**'
          - 'apps/prairielearn/src/ee/lib/course-agent/**'
          - 'apps/prairielearn/src/ee/pages/courseAgentPanelSettings/**'
          # Course-agent-only files that live alongside shared code.
          - 'apps/prairielearn/**/*{courseAgent,CourseAgent,course-agent,course_agent}*'
          - 'apps/prairielearn/**/*{courseAgent,CourseAgent,course-agent,course_agent}*/**'
          - 'database/**/*course_agent*'
