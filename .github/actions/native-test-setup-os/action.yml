name: Native test setup (OS and Python)
description: Installs OS packages and Python dependencies for running PrairieLearn tests natively on the runner.

# This action and `native-test-setup-node` are meant to run concurrently in a
# `parallel` step group, since GitHub Actions doesn't allow `parallel` or
# `background` steps inside a composite action. Neither action may depend on
# anything the other one sets up.

runs:
  using: composite
  steps:
    # The default Azure apt mirror on GitHub Actions runners is frequently
    # slow or throttled, causing apt-get operations to take minutes instead
    # of seconds. This action finds and configures a faster mirror.
    - uses: vegardit/fast-apt-mirror.sh@806c59276adfff2df420124ad5e4587f018c358a # 1.4.5
      with:
        exclude-current: true # Don't include the current APT mirror since it is unreliable.

    # We uninstall `man-db` to speed up the installation of other packages
    # by avoiding building man pages for them. As this is a non-interactive
    # environment, we will never need man pages anyways.
    #
    # We don't install `texlive` since it's a huge package and the test suite
    # doesn't require it.
    - name: Install OS packages
      shell: bash
      run: |
        sudo apt-get purge -y man-db
        sudo apt-get install -y --no-install-recommends \
          graphviz \
          libgraphviz-dev \
          libgvplugin-gd-dev \
          libgvplugin-neato-layout-dev \
          libgvplugin-pango-dev

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml'
        cache-suffix: core
    # This builds pygraphviz from source, so it must run after the graphviz
    # packages are installed.
    - name: Install core Python dependencies
      shell: bash
      env:
        UV_LOCKED: 1
      run: make python-deps-core

    - name: Configure git
      shell: bash
      run: |
        git config --global user.email "dev@example.com"
        git config --global user.name "Dev User"
        git config --global safe.directory '*'
