name: Native test build
description: Builds all code for running PrairieLearn tests natively on the runner. Requires `native-test-setup-node`.

runs:
  using: composite
  steps:
    - name: Set up Turborepo cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
    - name: Build all code
      shell: bash
      run: make build
