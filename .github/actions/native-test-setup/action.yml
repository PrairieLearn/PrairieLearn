name: Native test setup
description: Shared setup steps for running PrairieLearn tests natively on the runner.

inputs:
  install-playwright-browsers:
    description: Whether to install Playwright browsers (chromium).
    required: false
    default: 'false'
  build-assets:
    description: Whether to build the app's frontend assets. Vitest serves assets in dev mode, so it doesn't need them.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The default Azure apt mirror on GitHub Actions runners is frequently
    # slow or throttled, causing apt-get operations to take minutes instead
    # of seconds. This action finds and configures a faster mirror.
    - uses: vegardit/fast-apt-mirror.sh@806c59276adfff2df420124ad5e4587f018c358a # 1.4.5
      with:
        exclude-current: true # Don't include the current APT mirror since it is unreliable.

    # We uninstall `man-db` to speed up the installation of other packages
    # by avoiding building man pages for them. As this is a non-interactive
    # environment, we will never need man pages anyways.
    #
    # We don't install `texlive` since it's a huge package and the test suite
    # doesn't require it.
    - name: Install OS packages
      shell: bash
      run: |
        sudo apt-get purge -y man-db
        sudo apt-get install -y --no-install-recommends \
          graphviz \
          libgraphviz-dev \
          libgvplugin-gd-dev \
          libgvplugin-neato-layout-dev \
          libgvplugin-pango-dev

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
        cache: 'pnpm'
    - name: Install Node dependencies
      shell: bash
      run: pnpm install
    - name: Install Playwright browsers
      if: inputs.install-playwright-browsers == 'true'
      shell: bash
      run: pnpm playwright install chromium --with-deps

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        cache-dependency-glob: 'pyproject.toml'
        cache-suffix: core
    - name: Install core Python dependencies
      shell: bash
      env:
        UV_LOCKED: 1
      run: make python-deps-core

    # A PR's commit changes whenever master moves, so keying only on the commit
    # often restores a cache built from older package sources, and every
    # package gets rebuilt. Prefer caches built from the same package sources,
    # whether on master or this branch.
    - name: Hash package sources for the Turborepo cache
      id: turbo-cache
      shell: bash
      run: echo "packages-hash=$(git ls-files -s packages pnpm-lock.yaml turbo.jsonc | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Set up Turborepo cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ steps.turbo-cache.outputs.packages-hash }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ steps.turbo-cache.outputs.packages-hash }}-
          ${{ runner.os }}-turbo-
    - name: Build all code
      if: inputs.build-assets == 'true'
      shell: bash
      run: make build
    - name: Build all code except frontend assets
      if: inputs.build-assets != 'true'
      shell: bash
      run: |
        pnpm turbo run build --filter='!@prairielearn/prairielearn' --output-logs=errors-only
        cd apps/prairielearn
        # Type checking happens in the Check workflow, so only emit JavaScript.
        pnpm exec tsc --build --noCheck
        pnpm exec tscp -b

    - name: Configure git
      shell: bash
      run: |
        git config --global user.email "dev@example.com"
        git config --global user.name "Dev User"
        git config --global safe.directory '*'
