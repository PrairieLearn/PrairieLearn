name: Native test setup (Node)
description: Installs Node dependencies for running PrairieLearn tests natively on the runner.

# This action runs concurrently with `native-test-setup-os` (see the workflows
# that use it), since GitHub Actions doesn't allow `parallel` or `background`
# steps inside a composite action. Neither action may depend on anything the
# other one sets up.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
        cache: 'pnpm'
    - name: Install Node dependencies
      shell: bash
      run: pnpm install
