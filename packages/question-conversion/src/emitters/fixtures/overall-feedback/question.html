<pl-question-panel>
<p>At sea level, at what temperature does water freeze?</p>
</pl-question-panel>

<pl-multiple-choice answers-name="answer">
  <pl-answer correct="true">0 °C</pl-answer>
  <pl-answer correct="false">100 °C</pl-answer>
</pl-multiple-choice>

<pl-answer-panel>
<p>Water freezes at 0 °C and boils at 100 °C at sea level.</p>
</pl-answer-panel>
