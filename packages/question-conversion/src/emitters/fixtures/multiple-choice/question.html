<pl-question-panel>
<p>Which gas do plants absorb during photosynthesis?</p>
</pl-question-panel>

<pl-multiple-choice answers-name="answer">
  <pl-answer correct="true" feedback="&lt;p&gt;Plants use carbon dioxide to make sugars.&lt;/p&gt;">Carbon dioxide</pl-answer>
  <pl-answer correct="false" feedback="&lt;p&gt;Oxygen is released during photosynthesis.&lt;/p&gt;">Oxygen</pl-answer>
</pl-multiple-choice>

<pl-answer-panel>
<p>Plants use carbon dioxide, water, and light to make sugars.</p>
</pl-answer-panel>
