<pl-question-panel>
  <p>Edit the provided curves or draw new ones with the Spline and Polyline tools.</p>
</pl-question-panel>
<pl-sketch answers-name="sketch" width="800" height="450" x-range="-4,4" y-range="-3,3">
  <pl-sketch-tool id="spline" type="spline" label="Spline" color="green"></pl-sketch-tool>
  <pl-sketch-tool id="polyline" type="polyline" label="Polyline" color="purple"></pl-sketch-tool>
  <pl-sketch-initial tool-id="spline" coordinates="(-3,-1),(-2,1),(-1,-1)"></pl-sketch-initial>
  <pl-sketch-initial tool-id="polyline" coordinates="(1,-1),(2,1),(3,-1)"></pl-sketch-initial>
</pl-sketch>
