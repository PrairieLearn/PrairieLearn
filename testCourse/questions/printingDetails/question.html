<pl-question-panel>
  <p>Use the reference below to enter the number of listed values.</p>
  <details>
    <summary>Reference values</summary>
    <p>The values are one and two.</p>
    <ul>
      <li>One</li>
      <li>Two</li>
    </ul>
  </details>
  <details open>
    <summary>Additional context</summary>
    <p>Count both values.</p>
  </details>
</pl-question-panel>
<pl-integer-input answers-name="count" label="Number of values"></pl-integer-input>
