# Contains no credentials or repository data. Model requests go to the Worker's outbound handler.
model_provider = "prairielearn"
# Codex offers its `web.run` browsing tool to a custom provider only when the provider declares
# standalone web search; CourseAgentModelOutbound fixes its settings.
web_search = "live"
# Courses developed with Claude Code keep their instructions in CLAUDE.md. Codex reads it from a
# directory that has no AGENTS.md.
project_doc_fallback_filenames = ["CLAUDE.md"]

[model_providers.prairielearn]
name = "PrairieLearn"
base_url = "http://model.internal/v1"
wire_api = "responses"
supports_websockets = false
requires_openai_auth = false
supports_standalone_web_search = true

# Codex enables OpenAI's server-side compaction only for its built-in OpenAI provider. It reuses the
# cached prompt prefix instead of resending the history under a summarization prompt.
[model_providers.prairielearn.capabilities]
remote_compaction = "v2"

# Features the course agent doesn't use, so the runner doesn't start or advertise them. These are
# Codex 0.167.1's flag names; check `codex features list` when upgrading.
[features]
apps = false
browser_annotation_api = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
daemon_auto_start = false
goals = false
guardian_approval = false
hooks = false
image_generation = false
in_app_browser = false
in_app_chat = false
in_app_dictation = false
in_app_local_automation = false
in_app_updates = false
in_app_voice = false
multi_agent = false
plugin_discovery_prefetch = false
plugin_sharing = false
plugins = false
remote_plugin = false
shell_snapshot = false
skill_mcp_dependency_install = false
tool_suggest = false
# `instant_interrupt` stays at its default, on: a message staff send during a turn cuts off the
# model reply in progress, and Codex saves the message at once. With it off, Codex holds the message
# in memory until that reply ends and discards it if the turn is stopped first. Naming the feature
# here to pin it on makes Codex warn on every thread, so it is left out. See "Messages during a
# turn" in CONTRACT.md.

# Codex's bundled skills (image generation, skill installation, OpenAI docs, ...) don't apply to
# course work or can't run in the offline sandbox. PrairieLearn's skills are in /etc/codex/skills.
[skills.bundled]
enabled = false
